<div class="affectation">
  <section class="inputs" aria-labelledby="app-title">
    <div class="title">
      <h1 id="app-title">Affectation RO</h1>
      <app-theme-toggle />
    </div>
    <app-input-panel [form]="form" [colLabels]="colLabels()" [rowLabels]="rowLabels()" />
  </section>

  <section class="outputs" aria-labelledby="outputs-title" tabindex="0">
    <div class="header">
      <h2 id="outputs-title" class="sr-only">Résolution pas à pas</h2>
      <button type="button" class="primary" [disabled]="!canCalculate()" (click)="calculate()">
        Calculer
      </button>
      <p class="status" aria-live="polite">{{ status() }}</p>
    </div>

    <div class="content">
      @if (solverError(); as error) {
        <p class="error" role="alert">{{ error }}</p>
      }
      @if (solution(); as solution) {
        @if (revealed() >= 1) {
          <app-step-one
            [result]="solution.stepOne"
            [colLabels]="colLabels()"
            [rowLabels]="rowLabels()"
            [headingId]="stepOneHeadingId"
          />
        }
        @for (view of iterationViews(); track view.number) {
          @if (view.visible > 0) {
            <app-iteration
              [iteration]="view.iteration"
              [number]="view.number"
              [visible]="view.visible"
              [headingIds]="view.headingIds"
              [colLabels]="colLabels()"
              [rowLabels]="rowLabels()"
            />
          }
        }
        @if (finished()) {
          <app-assignment-graph
            [title]="resultTitle()"
            [assignments]="solution.assignments"
            [total]="solution.total"
            [colLabels]="colLabels()"
            [rowLabels]="rowLabels()"
            [headingId]="resultHeadingId"
          />
        }
      }
      <div id="outputs-end"></div>
    </div>
  </section>
</div>
